  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-YOUR_CLIENT_ID" crossorigin="anonymous"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#121212',
              deep: '#49108B',
              primary: '#7E30E1',
              accent: '#E26EE5',
              light: '#F3F8FF'
            }
          },
          fontFamily: {
            sans: ['Inter', 'Noto Sans KR', 'sans-serif'],
          },
          animation: {
            'text-shimmer': 'text-shimmer 2.5s ease-out infinite',
          },
          keyframes: {
            'text-shimmer': {
              '0%, 100%': { 'background-position': 'left center' },
              '50%': { 'background-position': 'right center' },
            },
          },
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0a0a0a;
      color: #F3F8FF;
      scrollbar-width: thin;
      scrollbar-color: #7E30E1 #121212;
    }
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0a0a0a;
    }
    ::-webkit-scrollbar-thumb {
      background-color: #7E30E1;
      border-radius: 20px;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
