<svg xmlns="http://www.w3.org/2000/svg" width="860" height="645" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">이환 에스퍼 사이클 속성 조합 도표</title>
  <desc id="desc">빛, 령, 주, 암, 상, 혼의 인접 기본 사이클과 차지, 디스코드 복합 사이클을 나타낸 도표</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10121b"/>
      <stop offset="1" stop-color="#090a0f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".2"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <style>
      .kr{font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif}
      .edge{stroke:#596174;stroke-width:5;stroke-linecap:round}
      .edge-label{fill:#d9def0;font-size:22px;font-weight:800;text-anchor:middle;paint-order:stroke;stroke:#0d0f16;stroke-width:9px;stroke-linejoin:round}
      .node-label{fill:#fff;font-size:25px;font-weight:900;text-anchor:middle}
      .node-sub{fill:#d5d9e5;font-size:17px;font-weight:700;text-anchor:middle}
      .panel-title{fill:#fff;font-size:28px;font-weight:900}
      .panel-sub{fill:#abb2c5;font-size:19px;font-weight:600}
    </style>
  </defs>
  <rect width="1200" height="900" rx="36" fill="url(#bg)"/>
  <rect width="1200" height="900" rx="36" fill="url(#glow)"/>
  <rect x="2" y="2" width="1196" height="896" rx="34" fill="none" stroke="#343746" stroke-width="4"/>

  <g class="kr">
    <text x="60" y="68" fill="#fff" font-size="34" font-weight="900">에스퍼 사이클 속성 고리</text>
    <text x="60" y="101" fill="#969db0" font-size="19" font-weight="600">서로 맞닿은 속성끼리 교대해야 기본 사이클이 발동합니다</text>

    <!-- adjacency edges -->
    <line class="edge" x1="600" y1="160" x2="842" y2="300"/>
    <line class="edge" x1="842" y1="300" x2="842" y2="520"/>
    <line class="edge" x1="842" y1="520" x2="600" y2="660"/>
    <line class="edge" x1="600" y1="660" x2="358" y2="520"/>
    <line class="edge" x1="358" y1="520" x2="358" y2="300"/>
    <line class="edge" x1="358" y1="300" x2="600" y2="160"/>

    <!-- reaction labels -->
    <text class="edge-label" x="738" y="205">블라썸</text>
    <text class="edge-label" x="892" y="418">헥스</text>
    <text class="edge-label" x="738" y="627">스코치</text>
    <text class="edge-label" x="462" y="627">노바</text>
    <text class="edge-label" x="308" y="418">스테인</text>
    <text class="edge-label" x="462" y="205">레모라</text>

    <!-- center -->
    <circle cx="600" cy="410" r="112" fill="#151824" stroke="#7c3aed" stroke-width="3"/>
    <circle cx="600" cy="410" r="94" fill="none" stroke="#7c3aed" stroke-opacity=".35" stroke-width="2" stroke-dasharray="8 9"/>
    <text x="600" y="397" fill="#c4b5fd" font-size="22" font-weight="800" text-anchor="middle">사이클 수치 충전</text>
    <text x="600" y="435" fill="#fff" font-size="31" font-weight="900" text-anchor="middle">교대 · 발동</text>

    <!-- nodes -->
    <g filter="url(#shadow)">
      <circle cx="600" cy="160" r="78" fill="#151925" stroke="#e8f7ef" stroke-width="5"/>
      <image x="566" y="116" width="68" height="68" href="/assets/nte/types/light.webp"/>
      <text class="node-label" x="600" y="210">빛</text>

      <circle cx="842" cy="300" r="78" fill="#151925" stroke="#54dbc1" stroke-width="5"/>
      <image x="808" y="256" width="68" height="68" href="/assets/nte/types/anima.webp"/>
      <text class="node-label" x="842" y="350">령</text>

      <circle cx="842" cy="520" r="78" fill="#151925" stroke="#fb416f" stroke-width="5"/>
      <image x="808" y="476" width="68" height="68" href="/assets/nte/types/incantation.webp"/>
      <text class="node-label" x="842" y="570">주</text>

      <circle cx="600" cy="660" r="78" fill="#151925" stroke="#9b8cff" stroke-width="5"/>
      <image x="566" y="616" width="68" height="68" href="/assets/nte/types/chaos.webp"/>
      <text class="node-label" x="600" y="710">암</text>

      <circle cx="358" cy="520" r="78" fill="#151925" stroke="#5ec7ee" stroke-width="5"/>
      <image x="324" y="476" width="68" height="68" href="/assets/nte/types/lakshana.webp"/>
      <text class="node-label" x="358" y="570">혼</text>

      <circle cx="358" cy="300" r="78" fill="#151925" stroke="#f7dc3e" stroke-width="5"/>
      <image x="324" y="256" width="68" height="68" href="/assets/nte/types/psyche.webp"/>
      <text class="node-label" x="358" y="350">상</text>
    </g>

    <!-- composite panels -->
    <rect x="60" y="760" width="520" height="100" rx="24" fill="#151925" stroke="#58c890" stroke-opacity=".75" stroke-width="2"/>
    <g transform="translate(82 782)">
      <circle cx="28" cy="28" r="26" fill="#10131d" stroke="#f7dc3e" stroke-width="2"/>
      <image x="10" y="10" width="36" height="36" href="/assets/nte/types/psyche.webp"/>
      <circle cx="68" cy="28" r="30" fill="#10131d" stroke="#e8f7ef" stroke-width="3"/>
      <image x="47" y="7" width="42" height="42" href="/assets/nte/types/light.webp"/>
      <circle cx="108" cy="28" r="26" fill="#10131d" stroke="#54dbc1" stroke-width="2"/>
      <image x="90" y="10" width="36" height="36" href="/assets/nte/types/anima.webp"/>
    </g>
    <text class="panel-title" x="222" y="801">차지</text>
    <text class="panel-sub" x="222" y="833">블라썸 + 레모라 → 울트에너지 회복</text>

    <rect x="620" y="760" width="520" height="100" rx="24" fill="#151925" stroke="#b768ed" stroke-opacity=".75" stroke-width="2"/>
    <g transform="translate(642 782)">
      <circle cx="28" cy="28" r="26" fill="#10131d" stroke="#5ec7ee" stroke-width="2"/>
      <image x="10" y="10" width="36" height="36" href="/assets/nte/types/lakshana.webp"/>
      <circle cx="68" cy="28" r="30" fill="#10131d" stroke="#9b8cff" stroke-width="3"/>
      <image x="47" y="7" width="42" height="42" href="/assets/nte/types/chaos.webp"/>
      <circle cx="108" cy="28" r="26" fill="#10131d" stroke="#fb416f" stroke-width="2"/>
      <image x="90" y="10" width="36" height="36" href="/assets/nte/types/incantation.webp"/>
    </g>
    <text class="panel-title" x="782" y="801">디스코드</text>
    <text class="panel-sub" x="782" y="833">노바 + 스코치 → 붕괴 수치 감소</text>
  </g>
</svg>
